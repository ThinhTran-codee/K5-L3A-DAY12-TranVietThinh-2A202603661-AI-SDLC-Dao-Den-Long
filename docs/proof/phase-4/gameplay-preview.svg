  <polygon points="618,525 640,468 662,525" fill="#E8E2D0"/>
  <rect x="625" y="476" width="30" height="10" rx="4" fill="#C8102E"/>
  <circle cx="640" cy="458" r="13" fill="#FDE68A"/>
