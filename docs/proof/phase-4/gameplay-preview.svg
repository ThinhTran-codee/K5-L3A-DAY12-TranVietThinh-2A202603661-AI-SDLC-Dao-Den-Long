  <circle cx="890" cy="425" r="75" fill="url(#lanternGlow)"/>
  <rect x="884" y="425" width="12" height="70" fill="#6B4A2F"/>
  <rect x="874" y="402" width="32" height="28" rx="4" fill="#FFE9B0" stroke="#FFB347" stroke-width="2"/>
