  <rect x="460" y="625" width="360" height="72" rx="14" fill="#0E1430" fill-opacity="0.88" stroke="#F2C14E" stroke-width="1.5"/>
  <text x="640" y="650" text-anchor="middle" fill="#F2C14E" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold">ĐOM ĐÓM (7/14)</text>
