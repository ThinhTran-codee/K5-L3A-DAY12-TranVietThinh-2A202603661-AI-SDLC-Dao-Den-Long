  <rect x="980" y="20" width="276" height="58" rx="14" fill="#0E1430" fill-opacity="0.86" stroke="#F2C14E" stroke-width="1.5"/>
  <text x="1118" y="56" text-anchor="middle" fill="#F2C14E" font-family="Segoe UI, sans-serif" font-size="22" font-weight="bold">🏮 Đèn: 5/7   ⭐ Điểm: 1420</text>

