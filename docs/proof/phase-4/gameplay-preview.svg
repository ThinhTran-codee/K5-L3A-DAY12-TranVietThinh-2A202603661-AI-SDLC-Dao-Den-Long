  <circle cx="560" cy="450" r="14" fill="url(#moteGlow)"/>
  <circle cx="745" cy="470" r="14" fill="url(#moteGlow)"/>
  <circle cx="790" cy="510" r="14" fill="url(#moteGlow)"/>

