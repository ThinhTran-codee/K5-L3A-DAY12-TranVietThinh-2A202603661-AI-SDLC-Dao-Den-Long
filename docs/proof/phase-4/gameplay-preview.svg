<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1B2350"/>
      <stop offset="100%" stop-color="#0E1430"/>
    </radialGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE9B0" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#FFB347" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFB347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moteGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF6C2"/>
      <stop offset="60%" stop-color="#FFE58A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFE58A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Night Sky & Cloud Sea -->
  <rect width="1280" height="720" fill="url(#skyGrad)"/>
  <ellipse cx="640" cy="640" rx="620" ry="110" fill="#12384A" opacity="0.7"/>

  <!-- Island Terrain (Đảo Chuông 3 Tiers) -->
  <ellipse cx="640" cy="520" rx="470" ry="135" fill="#C9B48A"/>
