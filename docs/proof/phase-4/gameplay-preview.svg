  <text x="42" y="78" fill="#F5F1E6" font-family="Segoe UI, sans-serif" font-size="22">🔥🔥🔥  🧧 Bùa Gió: 8.5s</text>

  <rect x="565" y="20" width="150" height="58" rx="14" fill="#0E1430" fill-opacity="0.86" stroke="#F2C14E" stroke-width="1.5"/>
